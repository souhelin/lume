name: Publicar release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build e release
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar e testar
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m unittest discover -s testes -v
      - name: Construir wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Validar instalação isolada
        run: python scripts/validar_wheel.py
      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'rc') }}

name: Testes da Lume

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: Python ${{ matrix.python-version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar o pacote
        run: python -m pip install .
      - name: Construir pacote wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Executar testes
        run: python -m unittest discover -s testes -v
      - name: Validar instalação e exemplo
        run: |
          lume --versao
          lume --verificar exemplos/ola.lume
          lume exemplos/ola.lume
      - name: Validar o front-end semântico
        run: |
          lume --semantico --verificar exemplos/portugues_natural.lume
          lume --semantico exemplos/portugues_natural.lume

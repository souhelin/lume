name: Testes da Lume

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: Python ${{ matrix.python-version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar o pacote
        run: python -m pip install '.[updates,rdf]'
      - name: Construir pacote wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Validar wheel em ambiente isolado
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/validar_wheel.py
      - name: Executar testes
        run: python -m unittest discover -s testes -v
      - name: Validar instalação e exemplo
        run: |
          lume --versao
          lume --verificar exemplos/ola.lume
          lume exemplos/ola.lume
      - name: Validar o front-end semântico
        run: |
          lume --semantico --verificar exemplos/portugues_natural.lume
          lume --semantico exemplos/portugues_natural.lume
      - name: Smoke test dos benchmarks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python benchmarks/benchmark.py
          python benchmarks/benchmark_lexicon.py --iteracoes 1000



  bases-reais:
    name: Integração com OpenWordNet-PT completo
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar parser RDF
        run: python -m pip install '.[rdf]'
      - name: Baixar os arquivos oficiais OpenWordNet-PT
        run: |
          base=https://raw.githubusercontent.com/own-pt/openWordnet-PT/264016d5899e6969f6f7cb4f1d75fa06037c1fd7/data
          curl --fail --location --retry 3 "$base/own-pt-words.ttl" --output /tmp/words.ttl
          curl --fail --location --retry 3 "$base/own-pt-synsets.ttl" --output /tmp/synsets.ttl
          curl --fail --location --retry 3 "$base/own-pt-wordsenses.ttl" --output /tmp/wordsenses.ttl
          curl --fail --location --retry 3 "$base/own-pt-relations.ttl" --output /tmp/relations.ttl
      - name: Importar e validar dados reais
        run: |
          python scripts/testar_bases_reais.py \
            /tmp/words.ttl /tmp/synsets.ttl /tmp/wordsenses.ttl /tmp/relations.ttl

  fserb-real:
    name: Integração com snapshot completo fserb/pt-br
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pacote
        run: python -m pip install .
      - name: Baixar snapshot público fixado
        run: |
          base=https://raw.githubusercontent.com/fserb/pt-br/93ba2a6f3b2f85262fba72df09d448c6bb2fa50a
          curl --fail --location --retry 3 "$base/lexico" --output /tmp/lexico
          curl --fail --location --retry 3 "$base/conjuga%C3%A7%C3%B5es" --output /tmp/conjugacoes
          curl --fail --location --retry 3 "$base/listas/verbos" --output /tmp/verbos
          curl --fail --location --retry 3 "$base/icf" --output /tmp/icf
      - name: Importar e validar base fserb completa
        run: |
          python scripts/testar_fserb_real.py \
            /tmp/lexico /tmp/conjugacoes /tmp/verbos /tmp/icf
